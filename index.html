<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LP Content Lab — Sistemas de Contenido & Orquestación Multi-Agente</title>
<meta name="description" content="LP Content Lab — Laboratorio de repurposing de contenido B2B y orquestación multi-agente de IA para directivos y firmas inmobiliarias. Una vertical oficial de LP & Co. Diego Lecourtois Palencia, fundador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#060606;
  --fg:#ededeb;
  --walnut:#241a15;
  --walnut-border:#3d2a21;
  --crimson:#781218;
  --crimson-glow:rgba(120,18,24,0.3);
  --gold:#c99a45;
  --gold-dim:rgba(201,154,69,0.35);
  --f80:rgba(237,237,235,.85);
  --f60:rgba(237,237,235,.6);
  --f40:rgba(237,237,235,.4);
  --f20:rgba(237,237,235,.2);
  --f10:rgba(237,237,235,.1);
  --f05:rgba(237,237,235,.05);
  --display:'Michroma','Eurostile','Arial Black',sans-serif;
  --body:'Instrument Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.1,1);
}
html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden}
body{font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none}
:focus-visible{outline:1px solid var(--gold);outline-offset:3px}

#stage{position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.moving{will-change:transform}
#map{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#map *{vector-effect:non-scaling-stroke}
.orb{fill:none;stroke:var(--fg);stroke-opacity:.06}
.spoke{stroke:var(--fg);stroke-opacity:.08}
.seq{fill:none;stroke:var(--gold);stroke-opacity:.35;stroke-dasharray:2 10}
.ring{stroke:var(--fg);stroke-opacity:.4;transition:stroke-opacity .6s}
.ring2{fill:none;stroke:var(--gold);stroke-opacity:.18;stroke-dasharray:3 12}
.tick{stroke:var(--gold);stroke-opacity:.6}
.num{font-family:var(--display);font-size:240px;fill:var(--fg);fill-opacity:.04;transition:fill-opacity .6s}
.tag,.coord{font-family:var(--mono);font-size:22px;letter-spacing:.16em;fill:var(--fg);fill-opacity:.5}
.hubtxt{font-family:var(--display);font-size:72px;fill:var(--fg);opacity:0;transition:opacity .6s;letter-spacing:.06em}
.node.cur .ring,.hub.cur .ring{stroke-opacity:1;stroke:var(--gold)}
body.ov .num{fill-opacity:.14}
body.ov .hubtxt{opacity:1}

/* Labels */
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 12px;background:rgba(6,6,6,.92);border:1px solid var(--f20);
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity .4s,background .2s,color .2s,border-color .2s}
.lbl small{font-size:9px;color:var(--gold)}
body.ov .lbl{opacity:1;pointer-events:auto}
.lbl:hover,.lbl:focus-visible{background:var(--fg);color:var(--bg);border-color:var(--gold)}
.lbl:hover small,.lbl:focus-visible small{color:var(--crimson)}
.lbl.hubl{display:none}

/* Top & Bottom Bars */
.bar-top,.bar-bot{position:fixed;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-inline:max(16px,env(safe-area-inset-left,0px));font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.bar-top{top:0;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:14px;color:var(--f60);pointer-events:none}
.bar-top b{color:var(--fg);font-weight:600}
.brand-badge{display:inline-flex;align-items:center;gap:8px}
.brand-badge .dot{width:6px;height:6px;background:var(--crimson);border-radius:50%;box-shadow:0 0 8px var(--crimson)}
.switcher{display:flex;gap:4px;pointer-events:auto}
.sw-btn{border:1px solid var(--f40);padding:5px 10px;background:var(--bg);color:var(--fg);transition:background .2s,color .2s;font-size:10px}
.sw-btn:hover{background:var(--fg);color:var(--bg)}
.sw-btn.active{background:var(--crimson);color:#fff;border-color:var(--crimson);font-weight:600}

.bar-bot{bottom:0;flex-direction:column;align-items:stretch;gap:10px;padding-top:10px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--bg) 60%,rgba(6,6,6,0))}
.prog{display:flex;gap:4px}
.prog button{flex:1;height:14px;display:flex;align-items:center}
.prog button::after{content:"";display:block;width:100%;height:2px;background:var(--f20);transition:background .3s}
.prog button[aria-current="step"]::after,.prog button.done::after{background:var(--gold)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ctl .now{color:var(--f60);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ctl .now b{color:var(--fg);font-weight:500}
.ctl .btns{display:flex;gap:6px;flex:none}
.btn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--f40);background:var(--bg);color:var(--fg);padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.solid:hover{background:var(--bg);color:var(--fg)}
.btn.crimson{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.btn.crimson:hover{background:#9e171f;border-color:#9e171f}
.btn.gold{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.btn.gold:hover{background:#dfae53}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn:disabled{opacity:.3;pointer-events:none}

#hint{position:fixed;left:0;right:0;top:calc(54px + env(safe-area-inset-top,0px));text-align:center;z-index:4;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
  opacity:0;transition:opacity .4s;pointer-events:none;padding-inline:16px}
body.ov #hint{opacity:1}

/* Content Panel */
#panel{position:fixed;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;
  padding:calc(56px + env(safe-area-inset-top,0px)) 16px calc(112px + env(safe-area-inset-bottom,0px))}
#card{pointer-events:auto;position:relative;width:100%;max-width:720px;max-height:100%;overflow:auto;overscroll-behavior:contain;
  padding:clamp(24px,4.5vw,44px);background:rgba(8,7,7,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--walnut-border);box-shadow:0 24px 60px rgba(0,0,0,.8);
  opacity:0;transform:scale(.97);transition:opacity .35s,transform .5s var(--ease);visibility:hidden}
#panel.on #card{opacity:1;transform:none;visibility:visible}
#card::before,#card::after{content:"";position:absolute;width:16px;height:16px;border:1px solid var(--gold);pointer-events:none}
#card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
#card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
#card>*+*{margin-top:20px}
.rv{opacity:0;transform:translateY(10px);transition:opacity .5s var(--ease),transform .6s var(--ease);transition-delay:calc(var(--i,0) * 70ms + 120ms)}
#panel.on .rv{opacity:1;transform:none}

/* Typography */
.eye{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1.hero{font-family:var(--display);font-weight:400;font-size:clamp(28px,7vw,58px);line-height:1.08;letter-spacing:.02em;margin:0}
h2{font-family:var(--display);font-weight:400;font-size:clamp(20px,3.2vw,30px);line-height:1.24;letter-spacing:.01em;margin:0;text-wrap:balance}
.lead{font-size:16px;color:var(--f80);max-width:60ch;margin:0}
.lead.sm{font-size:14px;color:var(--f60)}
.byline{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.byline span+span{color:var(--f60)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--f40)}
.mod{border:1px solid var(--walnut-border);background:rgba(20,15,12,.4);padding:20px;display:flex;flex-direction:column;gap:14px}

/* Interactive Components */
.seg{display:flex;border:1px solid var(--f40)}
.seg button{flex:1;padding:10px 8px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,color .2s}
.seg button+button{border-left:1px solid var(--f40)}
.seg button:hover{background:var(--f10)}
.seg button[aria-pressed="true"]{background:var(--crimson);color:#fff;font-weight:600}
.out{margin:0;min-height:3.5em;color:var(--f80);font-size:14px;line-height:1.55}
.out q{font-family:var(--display);font-size:14px;letter-spacing:.02em;display:block;margin-bottom:6px;color:var(--gold);font-style:normal}

/* Swarm Terminal / Chat */
.swarm-box{display:flex;flex-direction:column;gap:10px;font-family:var(--mono);font-size:12px;background:#050505;border:1px solid var(--walnut-border);padding:14px}
.swarm-msg{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--f05)}
.swarm-msg:last-child{border-bottom:0}
.swarm-agent{color:var(--gold);font-weight:600}
.swarm-text{color:var(--f80)}
.swarm-badge{display:inline-block;padding:2px 6px;background:var(--crimson);color:#fff;font-size:9px;border-radius:2px;margin-left:6px}

/* Grid & Stats */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
.stat-box{border:1px solid var(--walnut-border);background:rgba(36,26,21,.3);padding:16px;display:flex;flex-direction:column;gap:4px}
.stat-box b{font-family:var(--display);font-size:clamp(22px,4vw,34px);font-weight:400}
.stat-box span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--f60)}
.stat-box.solid{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.stat-box.solid span{color:rgba(255,255,255,.8)}

.facts{margin:0;display:grid;border-top:1px solid var(--walnut-border)}
.facts>div{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--walnut-border)}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding-top:2px}
.facts dd{margin:0;font-size:14px;color:var(--f80)}

/* Pricing / Calculator */
.calc label{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--f80);font-family:var(--mono)}
.calc output{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:-4px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--f40)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7.5px;background:var(--gold);border:0;border-radius:0}
input[type=range]::-moz-range-track{height:1px;background:var(--f40)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--gold);border:0;border-radius:0}
.res{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--gold)}
.res>div{padding:14px;display:flex;flex-direction:column;gap:4px;background:#050505}
.res>div+div{border-left:1px solid var(--gold);background:var(--gold);color:var(--bg)}
.res small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.res b{font-family:var(--display);font-weight:400;font-size:clamp(16px,3.4vw,24px);font-variant-numeric:tabular-nums}

/* Input Fields */
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.fld input,.fld textarea{background:#000;border:1px solid var(--f40);color:var(--fg);padding:10px 12px;font-family:var(--mono);font-size:13px;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--gold)}

@media (max-width:560px){
  .bar-top .pres{display:none}
  .stat-grid{grid-template-columns:1fr}
  .facts>div{grid-template-columns:1fr;gap:2px}
  .swarm-msg{grid-template-columns:1fr;gap:2px}
  .ctl .now span{display:none}
  .btn{padding:10px 11px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}
}
</style>
</head>
<body>

<div id="stage">
  <div id="world"><svg id="map" aria-hidden="true"></svg></div>
  <div id="labels"></div>
</div>

<header class="bar-top">
  <span class="brand-badge"><span class="dot"></span><b>LP Content Lab</b><span class="pres"> &nbsp;/&nbsp; Repurposing B2B</span></span>
  <nav class="switcher">
    <a href="https://lp-and-co.vercel.app/" target="_blank" class="sw-btn">LP &amp; Co.</a>
    <a href="/" class="sw-btn active">Content Lab</a>
    <a href="https://lp-and-co.vercel.app/diego" target="_blank" class="sw-btn">Diego</a>
  </nav>
</header>
<p id="hint">Mapa del Sistema · Elige un nodo para navegar</p>

<div id="panel" aria-live="polite"><article id="card"></article></div>

<nav class="bar-bot" aria-label="Navegación del sistema">
  <div class="prog" id="prog"></div>
  <div class="ctl">
    <p class="now" id="now" style="margin:0"></p>
    <div class="btns">
      <button class="btn" id="prev" aria-label="Anterior">←</button>
      <button class="btn" id="map-btn" aria-pressed="false">Mapa</button>
      <button class="btn solid" id="next" aria-label="Siguiente">→</button>
    </div>
  </div>
</nav>

<script>
(function(){
const $=s=>document.querySelector(s);
const world=$('#world'), svg=$('#map'), panel=$('#panel'), card=$('#card'), labels=$('#labels');
const R=420, HUB=560;
const ROT=[-6,5,-4,8,-5,4];
const NODES=Array.from({length:6},(_,i)=>{
  const a=(-90+i*360/6)*Math.PI/180;
  const d=i%2?1650:1440;
  return{x:Math.round(Math.cos(a)*d),y:Math.round(Math.sin(a)*d),r:ROT[i]};
});
const pad=n=>String(n).padStart(2,'0');
const usd=v=>'$'+Math.round(v).toLocaleString('en-US')+' USD';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- SLIDES CONTENT ---------- */
const S=[
{id:'inicio',label:'Inicio',at:'hub',html:`
<p class="eye rv" style="--i:0">Vertical Oficial de LP &amp; Co. &middot; Cancún, México</p>

</div>
<div class="stat-grid rv" style="--i:4">

</div>
<div class="row rv" style="--i:5">

</div>
<p class="hint rv" style="--i:6">Navega con flechas &larr; &rarr; del teclado o pulsa M para ver la órbita completa.</p>`},

{id:'manifiesto',label:'01 — Manifiesto',at:0,html:`

    lab:'<q>Infraestructura sin Fricción</q>Tú solo grabas tus llamadas, podcasts o recorridos (1 hora por semana). Nuestro enjambre multi-agente extrae tus mejores tesis y te entrega 16 piezas terminadas de video vertical y LinkedIn listas en Drive.'

{id:'enjambre',label:'02 — El Enjambre',at:1,html:`
<p class="eye rv" style="--i:0">02 &mdash; Tecnología Propietaria</p>

{id:'piloto',label:'03 — Caso Piloto',at:2,html:`
<p class="eye rv" style="--i:0">03 &mdash; Prueba de Concepto en Vivo</p>
<h2 class="rv" style="--i:1">Caso: HAUS Talks EP. 21</h2>
<p class="lead rv" style="--i:2">Extraído del podcast de Haus Real Estate: "¿Por qué construir menos en Tulum?". De un video largo de YouTube a una pieza de asalto para inversionistas.</p>
<div class="seg rv" style="--i:3" id="cseg">

</div>
<div class="mod rv" style="--i:4">
  <div id="cout" style="font-size:13.5px;color:var(--f80);line-height:1.55"></div>
</div>`,
init(){
  const T={
    hook:`<p class="eye" style="color:var(--gold);margin:0 0 6px">HOOK EN PANTALLA (PRIMEROS 3 SEG):</p>
          <p style="font-family:var(--display);font-size:16px;color:#fff;margin:0 0 10px">"EL ERROR DE $200K QUE NADIE TE DICE DE TULUM 🚨"</p>

function seg(sel,cb){
  const el=$(sel); if(!el)return;
  const pick=v=>{
    el.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==v));
    cb(v);
  };
  el.addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(b.dataset.v)});
  const cur=el.querySelector('[aria-pressed="true"]');
  if(cur) pick(cur.dataset.v);
}

/* ---------- BUILD SVG ORBITAL MAP ---------- */
(function build(){
  let s=`<defs>
    <pattern id="dots" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="45" cy="45" r="2" fill="#ededeb" fill-opacity=".1"/>
    </pattern>
  </defs>
  <rect x="-3400" y="-3400" width="6800" height="6800" fill="url(#dots)"/>`;
  [920,1440,1650,2300].forEach(r=>s+=`<circle r="${r}" class="orb"/>`);
  NODES.forEach(n=>s+=`<line x1="0" y1="0" x2="${n.x}" y2="${n.y}" class="spoke"/>`);
  s+=`<polyline class="seq" points="${[{x:0,y:0},...NODES].map(p=>p.x+','+p.y).join(' ')}"/>`;
  const ticks=(r,a)=>[0,90,180,270].map(g=>`<line x1="0" y1="${-r-14}" x2="0" y2="${-r+22}" transform="rotate(${g+a})" class="tick"/>`).join('');
  s+=`<g class="hub" id="g0"><circle r="${HUB}" class="ring" fill="#060606"/><circle r="${HUB*.72}" class="ring2"/>${ticks(HUB,45)}
    <text class="hubtxt" y="24" text-anchor="middle">CONTENT LAB</text>
    <text class="coord" y="${HUB+72}" text-anchor="middle">21.16° N · 86.85° W — CARIBE MEXICANO</text></g>`;
  NODES.forEach((n,i)=>{s+=`<g class="node" id="g${i+1}" transform="translate(${n.x} ${n.y}) rotate(${n.r})">
    <circle r="${R}" class="ring" fill="#060606"/><circle r="${R-32}" class="ring2"/>${ticks(R,0)}
    <text class="num" y="84" text-anchor="middle">${pad(i+1)}</text>
    <text class="tag" y="${-R-42}" text-anchor="middle">${pad(i+1)} / 06 — ${S[i+1].label.toUpperCase()}</text></g>`;});
  svg.innerHTML=s;
  labels.innerHTML=[`<button class="lbl hubl" data-go="0">Inicio</button>`].concat(NODES.map((n,i)=>`<button class="lbl" data-go="${i+1}"><small>${pad(i+1)}</small>${S[i+1].label}</button>`)).join('');
  $('#prog').innerHTML=S.map((x,i)=>`<button data-go="${i}" aria-label="Ir a ${x.label}"></button>`).join('');
})();

let vw=innerWidth, vh=innerHeight;
let cam={x:0,y:0,s:.2,r:0};
let step=0, mode='step', raf=0, token=0;

function target(which){
  const m=Math.min(vw,vh);
  if(which==='overview'){
    let x0=-HUB,x1=HUB,y0=-HUB,y1=HUB+90;
    NODES.forEach(n=>{x0=Math.min(x0,n.x-R-40);x1=Math.max(x1,n.x+R+40);y0=Math.min(y0,n.y-R-80);y1=Math.max(y1,n.y+R+40)});
    const aw=vw-32, ah=vh-170;
    const s=Math.min(aw/(x1-x0),ah/(y1-y0));
    return {x:(x0+x1)/2,y:(y0+y1)/2+28/s,s,r:0};
  }
  const at=S[which].at;
  if(at==='hub') return {x:0,y:0,s:m/(HUB*2.05),r:0};
  const n=NODES[at]; return {x:n.x,y:n.y,s:m/(R*1.95),r:n.r};
}
function apply(c){
  cam=c;
  world.style.transform=`translate(${vw/2}px,${vh/2}px) rotate(${-c.r}deg) scale(${c.s}) translate(${-c.x}px,${-c.y}px)`;
  const a=-c.r*Math.PI/180, co=Math.cos(a), si=Math.sin(a);
  const pts=[{x:0,y:0},...NODES];
  labels.querySelectorAll('.lbl').forEach((l,i)=>{const dx=pts[i].x-c.x, dy=pts[i].y-c.y;
    const X=vw/2+c.s*(dx*co-dy*si), Y=vh/2+c.s*(dx*si+dy*co);
    l.style.transform=`translate(${X}px,${Y}px) translate(-50%,-50%)`;});
}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function fly(to){
  cancelAnimationFrame(raf); const my=++token;
  return new Promise(res=>{
    const from={...cam};
    const dx=to.x-from.x, dy=to.y-from.y, d=Math.hypot(dx,dy);
    let dr=((to.r-from.r)%360+540)%360-180;
    if(reduce||d+Math.abs(Math.log(to.s/from.s))*400+Math.abs(dr)<1){apply(to);return res(my)}
    const l0=Math.log(from.s), l1=Math.log(to.s);
    const sFit=Math.min(vw,vh)/(d+R*2.4);
    const dip=Math.max(0,(l0+l1)/2-Math.log(Math.min(from.s,to.s,sFit)));
    const dur=Math.min(1900,1000+d*.35);
    const t0=performance.now(); world.classList.add('moving');
    const f=now=>{ if(my!==token) return;
      const t=Math.min(1,(now-t0)/dur), e=ease(t);
      apply({x:from.x+dx*e,y:from.y+dy*e,s:Math.exp(l0+(l1-l0)*e-dip*Math.sin(Math.PI*e)),r:from.r+dr*e});
      if(t<1) raf=requestAnimationFrame(f); else {world.classList.remove('moving');res(my)}
    };
    raf=requestAnimationFrame(f);
  });
}

function mark(){
  document.querySelectorAll('#map g').forEach(g=>g.classList.remove('cur'));
  const at=S[step].at; const g=document.getElementById('g'+(typeof at==='number'?at+1:0)); if(g&&mode==='step') g.classList.add('cur');
  $('#prog').querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('done',i<step);if(i===step&&mode==='step')b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
  $('#now').innerHTML=mode==='overview'?'<b>Mapa</b> <span>&middot; 7 Nodos</span>':`<b>${pad(step+1)} / ${pad(S.length)}</b> <span>&middot; ${S[step].label}</span>`;
  $('#prev').disabled=mode==='step'&&step===0; $('#next').disabled=mode==='step'&&step===S.length-1;
  $('#map-btn').setAttribute('aria-pressed',mode==='overview');
  document.body.classList.toggle('ov',mode==='overview');
}
function go(i){
  i=Math.max(0,Math.min(S.length-1,i)); step=i; mode='step'; mark();
  try{history.replaceState(null,'','#'+S[i].id)}catch(e){}
  panel.classList.remove('on');
  clearTimeout(swapTm); let swapped=false;
  const doSwap=()=>{if(swapped)return;swapped=true;card.innerHTML=S[i].html;card.scrollTop=0;S[i].init&&S[i].init();};
  swapTm=setTimeout(doSwap,reduce?0:260);
  fly(target(i)).then(my=>{ if(my!==token) return; clearTimeout(swapTm); doSwap();
    requestAnimationFrame(()=>requestAnimationFrame(()=>panel.classList.add('on')));});
}
let swapTm=0;
function overview(){ mode='overview'; panel.classList.remove('on'); mark(); fly(target('overview')); }

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);return}
  if(e.target.closest('[data-ov]')) overview();
});
$('#prev').onclick=()=>mode==='overview'?go(step):go(step-1);
$('#next').onclick=()=>mode==='overview'?go(step):go(step+1);
$('#map-btn').onclick=()=>mode==='overview'?go(step):overview();

addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'||(k===' '&&!e.target.closest('button,summary,input'))){e.preventDefault();mode==='overview'?go(step):go(step+1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();mode==='overview'?go(step):go(step-1)}
  else if(k==='m'||k==='M'){mode==='overview'?go(step):overview()}
  else if(k==='Escape'){mode==='overview'?go(step):overview()}
  else if(k==='Home'){go(0)} else if(k==='End'){go(S.length-1)}
});

let sx=null,sy=0;
addEventListener('pointerdown',e=>{if(e.target.closest('input,textarea,.bar-bot'))return;sx=e.clientX;sy=e.clientY},{passive:true});
addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){ if(mode==='overview') return; go(step+(dx<0?1:-1)); }},{passive:true});

addEventListener('resize',()=>{vw=innerWidth;vh=innerHeight;cancelAnimationFrame(raf);token++;
  apply(target(mode==='overview'?'overview':step));
  if(mode==='step'){if(!card.innerHTML){card.innerHTML=S[step].html;S[step].init&&S[step].init()}panel.classList.add('on')}});

/* start */
const h=(location.hash||'').slice(1); const start=Math.max(0,S.findIndex(x=>x.id===h));
mode='overview'; apply(target('overview')); mark();
setTimeout(()=>go(start), reduce?0:900);
})();
</script>
